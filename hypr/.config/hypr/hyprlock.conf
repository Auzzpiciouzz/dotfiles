source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

label {
    monitor =
    text = $TIME
    color = $on_surface
    font_size = 72
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    outer_color = $primary
    inner_color = $surface
    font_color = $on_surface
    check_color = $tertiary
    fail_color = $error
    placeholder_text = Password...
    fade_on_empty = false
    position = 0, -60
    halign = center
    valign = center
}
