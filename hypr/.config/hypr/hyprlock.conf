source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.7
    vibrancy = 0.16
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $on_surface
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 230
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = $TIME
    color = $on_surface
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

# Password field (pill shape, Caps Lock warning, attempt counter)
input-field {
    monitor =
    size = 300, 50
    rounding = -1
    outline_thickness = 2
    outer_color = $primary
    inner_color = $surface
    font_color = $on_surface
    check_color = $tertiary
    fail_color = $error
    capslock_color = $tertiary
    fail_text = $FAIL <b>($ATTEMPTS)</b>
    placeholder_text = Password...
    fade_on_empty = false
    position = 0, -50
    halign = center
    valign = center
}

# Now playing (empty when nothing is playing)
label {
    monitor =
    text = cmd[update:1000] /home/auzz/.local/bin/nowplaying.sh
    color = $tertiary
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -130
    halign = center
    valign = center
}

# Battery (top-right)
label {
    monitor =
    text = cmd[update:30000] echo "󰁹 $(cat /sys/class/power_supply/BAT*/capacity)%"
    color = $on_surface
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = -30, -30
    halign = right
    valign = top
}

